name: Update Ö1 RSS Feed & Website

on:
  schedule:
    # Läuft täglich um 05:00 UTC (06:00/07:00 CET) und 17:00 UTC (18:00/19:00 CET)
    - cron: '0 5,17 * * *'
  workflow_dispatch: # Ermöglicht manuelles Starten per Klick im GitHub-Browser
  push:
    branches:
      - main
    paths:
      - 'config.yaml'
      - 'oe1_rss.py'

permissions:
  contents: write

jobs:
  update-feed:
    runs-on: ubuntu-latest
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Feed & Webseite generieren
        run: |
          python3 oe1_rss.py -d 30

      - name: Änderungen ins Repository committen
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add feed.xml index.html
          if git diff --staged --quiet; then
            echo "Keine neuen Sendungen vorhanden."
          else
            git commit -m "Aktualisiere Ö1 Themen & Feed [skip ci]"
            git push
          fi
