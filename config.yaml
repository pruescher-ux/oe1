# Ö1 Themen-Monitor - Konfiguration
# =======================================================
# Du kannst diese Liste jederzeit um neue Sendungen erweitern!
# Trage einfach unter 'shows' eine neue Zeile mit:
#   - match: "Name der Sendung"
# ein. Die Groß-/Kleinschreibung spielt keine Rolle (z. B. "radiokolleg" findet "Radiokolleg").

feed:
  title: "Ö1 Themen-Übersicht"
  description: "Tägliche Themen und Schwerpunkte ausgewählter Ö1-Sendungen"
  link: "https://pruescher-ux.github.io/oe1/"
  language: "de-AT"

# Wie viele Tage rückwirkend die Themen geladen werden sollen (maximal 30 Tage)
days_back: 30

# Dateinamen für den Feed und die Webseite
output_feed: "feed.xml"
output_html: "index.html"

# =======================================================
# Deine überwachten Sendungen:
# =======================================================
shows:
  - match: "Gedanken"
  - match: "Gedanken für den Tag"
  - match: "Punkt eins"
  - match: "Science Arena"
  - match: "matrix"
  - match: "doublecheck"
  - match: "#doublecheck"
  - match: "Diagonal"
  - match: "Ambiente"
  - match: "Europa-Journal"
  - match: "Journal-Panorama"
  - match: "Klartext"
  - match: "Radiokolleg"
  - match: "Ex libris"
  - match: "Radiogeschichten"
  - match: "Passagen"
  - match: "Dimensionen"
  - match: "Im Fokus"
  - match: "Digital.Leben"
  - match: "Digital Leben"
